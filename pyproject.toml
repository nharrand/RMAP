[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmap"
version = "1.0.2"
description = "Reference implementation of the RMAP authentication protocol, for Software Security coursework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "nicolas.harrand@dsv.su.se" },
]
keywords = ["rmap", "authentication", "pgp", "SOFTSEC", "coursework"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Security",
]
dependencies = [
    "PGPy>=0.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://github.com/nharrand/RMAP"
Repository = "https://github.com/nharrand/RMAP"
Issues = "https://github.com/nharrand/RMAP/issues"

[project.scripts]
rmap-client = "rmap.cli_client:main"
rmap-keygen = "rmap.keygen:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
